<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Boom · control</title>
<style>
  /* Barra de control. Colores del logo: azul #2068D7 sobre azul oscuro. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
               font: 500 13px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #bar { position: absolute; inset: 7px; display: flex; align-items: center; gap: 5px; padding: 0 9px;
         background: linear-gradient(180deg, rgba(17,42,89,.97), rgba(11,31,68,.97)); border: 1px solid rgba(255,255,255,.16);
         border-radius: 27px; box-shadow: 0 2px 10px rgba(5,15,40,.45); -webkit-app-region: drag; }
  button { -webkit-app-region: no-drag; border: 0; background: transparent; color: #DCE7FA; cursor: pointer;
           width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; padding: 0; transition: background .12s, color .12s; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.14); color: #fff; }
  button:disabled { opacity: .3; cursor: default; }
  button.on { background: #2068D7; color: #fff; }
  button svg { width: 18px; height: 18px; fill: currentColor; }
  #stop { background: #2068D7; color: #fff; width: 40px; height: 40px; box-shadow: 0 0 0 3px rgba(32,104,215,.35); }
  #stop:hover { background: #2B76E8; }
  #time { min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 650; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #FF5A5F; margin-left: 5px; animation: blink 1.2s infinite; }
  .paused #dot { background: #F5B83D; animation: none; }
  @keyframes blink { 50% { opacity: .25 } }
  .sep { width: 1px; height: 26px; background: rgba(255,255,255,.16); margin: 0 3px; }
  .txt { width: auto; padding: 0 11px; border-radius: 18px; font: inherit; font-weight: 650; }
  .nocam .cam { display: none; }
  #undo { display: none; background: rgba(0,186,244,.22); color: #BDEBFF; } .canundo #undo { display: grid; }
  #cancel.on { background: #E5484D; color: #fff; }
  #state { font-size: 11px; color: #A9BCE0; min-width: 56px; white-space: nowrap; }
</style></head>
<body>
<div id="bar">
  <button id="stop" title="Terminar y guardar"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  <span id="dot"></span><span id="time">0:00</span><span id="state">grabando</span>
  <button id="pause" title="Pausar / reanudar (Alt+Shift+P)"><svg viewBox="0 0 24 24"><path id="pauseIcon" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
  <button id="rewind" title="Retroceder: borra lo grabado desde la última pausa (Alt+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
  <button id="undo" class="txt" title="Recuperar el último tramo descartado">Deshacer</button>
  <span class="sep cam"></span>
  <button class="cam shape" data-shape="circle" title="Cámara en círculo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
  <button class="cam shape" data-shape="square" title="Cámara cuadrada"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
  <button class="cam shape" data-shape="rect" title="Cámara rectangular"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="3"/></svg></button>
  <button class="cam shape" data-shape="full" title="Cámara a pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></button>
  <button class="cam txt" id="size" title="Tamaño de la cámara">M</button>
  <span class="sep"></span>
  <button id="cancel" title="Descartar toda la grabación"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 12H7z"/></svg></button>
</div>
<script src="control.js"></script>
</body></html>
